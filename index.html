<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joaquin's Advice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="crt"></div>
  <div id="fx"></div>

  <!-- TITLE SCREEN -->
  <div class="screen" id="titleScreen">
    <div class="title" id="title"><span class="word">Joaquin<span class="apos">'</span>s</span> <span class="word">Advice</span></div>
    <div class="tagline" id="tagline"></div>
    <div class="menu" id="titleMenu"></div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div class="screen hide" id="settingsScreen">
    <div class="title" style="font-size:clamp(30px,6vw,60px)">Settings</div>
    <div class="menu" id="settingsMenu"></div>
  </div>

  <!-- START PLACEHOLDER -->
  <div class="screen hide" id="startScreen">
    <div class="tagline pad" style="color:var(--white);font-size:clamp(16px,3vw,26px);letter-spacing:.04em;max-width:30ch">
      The first piece of advice is the hardest to give.
    </div>
    <div class="menu" id="startMenu"></div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen hide" id="gameScreen">
    <div class="dayhud" id="dayHud">Day 1</div>

    <div class="client">
      <div class="portrait" id="portrait"></div>
      <div class="nameplate" id="clientName"></div>
    </div>

    <div class="dialogue" id="dialogue"></div>

    <div class="prompt" id="advicePrompt">What do you tell them?</div>
    <div class="menu advice" id="adviceMenu"></div>

    <div class="result hide" id="result">
      <div class="result-text" id="resultText"></div>
      <div class="result-go" id="resultGo">[ press Enter ]</div>
    </div>
  </div>

  <!-- QUIT BLACKOUT -->
  <div class="blackout" id="blackout">
    <div class="line">. . .</div>
    <div class="sub" id="quitSub">[ press Enter ]</div>
  </div>

  <div class="hints" id="hints"></div>

<script src="script.js"></script>
</body>
</html>
